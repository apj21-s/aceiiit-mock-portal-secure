<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AceIIIT Mock Portal</title>
  <meta
    name="description"
    content="Zero-cost UGEE-style mock portal for AceIIIT with instructions, timed exam UI, analytics, and admin authoring."
  >
  <link rel="icon" type="image/svg+xml" href="assets/favicon-round.svg">
  <link rel="shortcut icon" href="assets/favicon-round.svg">
  <link rel="apple-touch-icon" href="assets/favicon-round.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/portal.css?v=1.0.31">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
</head>
<body>
  <svg width="0" height="0" style="position: absolute; pointer-events: none; z-index: -1;" aria-hidden="true">
    <filter id="liquid-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.04" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.005 0.04;0.015 0.08;0.005 0.04" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <noscript>
    <main class="no-js-shell">
      <h1>AceIIIT Mock Portal</h1>
      <p>This portal needs JavaScript enabled because the exam timer, palette, and report are interactive.</p>
    </main>
  </noscript>
  <div id="app"></div>
  <script src="js/seed.js?v=1.0.31"></script>
  <script src="js/storage.js?v=1.0.31"></script>
  <script src="js/auth.js?v=1.0.31"></script>
  <script src="js/db.js?v=1.0.31"></script>
  <script src="js/ui.js?v=1.0.31"></script>
  <script src="js/examIntegrity.js?v=1.0.31"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="js/app.js?v=1.0.31"></script>
</body>
</html>
